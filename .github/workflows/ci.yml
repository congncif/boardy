name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Install CocoaPods
        run: |
          gem install cocoapods -v 1.16.2 --install-dir "$RUNNER_TEMP/cocoapods" --no-document
          "$RUNNER_TEMP/cocoapods/bin/pod" --version

      - name: Install CocoaPods dependencies
        run: "$RUNNER_TEMP/cocoapods/bin/pod install --project-directory=Example --deployment"

      - name: Build and test
        run: >-
          xcodebuild test
          -workspace Example/Boardy.xcworkspace
          -scheme Boardy-Example
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -enableCodeCoverage YES
          CODE_SIGNING_ALLOWED=NO

      - name: Lint podspec
        run: pod lib lint Boardy.podspec --allow-warnings --no-clean
